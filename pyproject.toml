[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-visualizer"
version = "0.1.0"
description = "CLI-прототип визуализатора зависимостей Maven-пакетов"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
depviz = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
